name: Android CI/CD Build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # Manuel tetikleme desteği

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Java JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'gradle' # Otomatik Gradle cache yönetimi

    - name: Set up Gradle 8.4
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.4' # Yerel gradlew olmadığında otomatik Gradle kurulumu

    - name: Create local.properties with API Keys
      run: |
        echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" >> local.properties
        echo "CLAUDE_API_KEY=${{ secrets.CLAUDE_API_KEY }}" >> local.properties
        echo "PERPLEXITY_API_KEY=${{ secrets.PERPLEXITY_API_KEY }}" >> local.properties
        echo "DEEPL_API_KEY=${{ secrets.DEEPL_API_KEY }}" >> local.properties
        echo "local.properties başarıyla oluşturuldu ve API anahtarları eklendi."

    - name: Build Android Debug APK
      run: gradle assembleDebug

    - name: Upload Debug APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: app/build/outputs/apk/debug/app-debug.apk
        if-no-files-found: error
        retention-days: 14 # 14 gün boyunca indirilebilir durumda tutulur
